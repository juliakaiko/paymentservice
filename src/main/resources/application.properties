spring.application.name=paymentservice
spring.main.web-application-type=servlet
server.port=8084

# -------------------- OpenAPI --------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------- Security --------------------
security.public.endpoints=/actuator/**

# -------------------- Actuator --------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# -------------------- MongoDB --------------------
spring.data.mongodb.database=paymentDB

# -------------------- PostgreSQL --------------------
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------- Liquibase --------------------
spring.liquibase.enabled=true
liquibase.postgres.changelog=classpath:db/changelog/postgresql/db.changelog-master.xml
liquibase.mongodb.changelog=db/changelog/mongodb/db.changelog-master.xml

# -------------------- JPA --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------- External API --------------------
random.number.api.base-url=http://www.randomnumberapi.com/api/v1.0/random?min=1&max=100&count=1

# -------------------- Kafka Admin --------------------
spring.kafka.admin.properties.request.timeout.ms=30000
spring.kafka.admin.fail-fast=false

# -------------------- Kafka --------------------
kafka.consumer.topics.create-order=create-order
kafka.consumer.group-id=payment-service-group
kafka.producer.topics.create-payment=create-payment

# Max time to wait for a response from Kafka broker before failing the request
spring.kafka.properties.request.timeout.ms=30000

# Time to wait between retry attempts when a Kafka request fails
spring.kafka.properties.retry.backoff.ms=1000

# -------------------- Kafka Producer --------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# -------------------- Kafka Consumer --------------------
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.mymicroservices.common.events
spring.kafka.consumer.properties.spring.json.value.default.type=org.mymicroservices.common.events.OrderEventDto
#spring.kafka.consumer.properties.spring.json.use.type.headers=false

# At the first launch, we read everything from the beginning
spring.kafka.consumer.auto-offset-reset=earliest

#The message will be considered processed after a manual acknowledgment.acknowledge() call in the code.
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=true
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.retry.backoff.ms=5000
spring.kafka.consumer.properties.retries=10
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

# -------------------- Inbox --------------------
inbox.batch-size=100
inbox.max-retries=10
inbox.scheduler.fixed-delay-ms=1000

# -------------------- Logging (common) --------------------
logging.level.com.mymicroservice.paymentservice=INFO
