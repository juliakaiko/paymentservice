# -------------------- Logging --------------------
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

# -------------------- MongoDB --------------------
spring.data.mongodb.uri=mongodb://mongodb:27017/paymentDB

# -------------------- PostgreSQL --------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_POSTGRES_PAYMENT_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# -------------------- Kafka --------------------
spring.kafka.bootstrap-servers=kafka:9092

# Max time to wait for Kafka broker response
spring.kafka.properties.request.timeout.ms=30000

# Delay between retry attempts
spring.kafka.properties.retry.backoff.ms=1000

# High reliability retries
spring.kafka.properties.retries=1000

# Consumer group timeout before triggering rebalance
spring.kafka.consumer.properties.session.timeout.ms=30000

# Heartbeat interval for consumer liveness
spring.kafka.consumer.properties.heartbeat.interval.ms=3000


