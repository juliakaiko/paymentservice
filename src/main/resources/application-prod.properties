# -------------------- Logging --------------------
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

# -------------------- MongoDB --------------------
spring.data.mongodb.uri=mongodb://mongodb:27017/paymentDB

# -------------------- PostgreSQL --------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_POSTGRES_PAYMENT_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# -------------------- Kafka --------------------
spring.kafka.bootstrap-servers=kafka:9092

# Limited retries to fail fast in dev
spring.kafka.properties.retries=1000

# Time before consumer is considered dead
spring.kafka.consumer.properties.session.timeout.ms=30000


