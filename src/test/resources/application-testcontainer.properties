spring.application.name=paymentservice
spring.main.allow-bean-definition-overriding=true
spring.liquibase.enabled=false
spring.task.scheduling.enabled=false

kafka.consumer.topics.create-order=create-order
kafka.consumer.group-id=payment-service-test-group
kafka.producer.topics.create-payment=create-payment

random.number.api.base-url=http://localhost:8089
security.public.endpoints=/actuator/**

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=org.mymicroservices.common.events
spring.kafka.consumer.properties.spring.json.value.default.type=org.mymicroservices.common.events.OrderEventDto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=true
spring.kafka.listener.missing-topics-fatal=false

inbox.batch-size=100
inbox.max-retries=10
inbox.scheduler.fixed-delay-ms=1000

logging.level.com.mymicroservice.paymentservice=INFO
